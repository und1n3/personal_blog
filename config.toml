baseURL = "https://und1n3.github.io/personal_blog/"

title = "atzuris blog"
copyright = "atzuris ©"
relativeURLs = true

[module]
  [module.hugoVersion]
    min = "0.120.4"
    max = "0.121.0"


[params]
  name = "atzuris"
  description = "Personal blog with random stuff and projects I feel like posting."
  initials = "atz"
  googleAnalytics = ""

  [[params.social]]
    name = "Github"
    link = "#"
    icon = "fab fa-github"



[menu]
  [[menu.main]]
    name = "Digital Garden"
    url = "/garden/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    name = "Library"
    url = "/library/"
    weight = 3
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4


[taxonomies]
  garden_tags = 'garden_tags'
  project_tags = 'project_tags'
  library_tags = 'library_tags'


[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true
  [markup.highlight]
    style = 'modus-vivendi'
